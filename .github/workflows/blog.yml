# .github/workflows/blog.yml
#
# issue -> JSON -> gh-pages 的博客管线。
#
# 数据流：
#   Issue（带 blog label）--REST--> scripts/build-issues.mjs --> pages/blog/data/issues.json
#                                                              |
#                                                              v
#                          组装静态站点到 _site/ --> gh-pages 分支（Pages 源）
#
# 关键设计：
#   * 源码分支（dev）保持干净：脚本产物只随 gh-pages 部署，从不回写 dev。
#   * 唯一写入 gh-pages 的地方是 peaceiris/actions-gh-pages，它用一次普通 push 完成，
#     不产生对 dev 的提交。
#   * 防无限循环：push 触发器被限定为 branches: [dev] 且 paths 只命中 scripts/**、
#     pages/blog/**。机器人往 gh-pages 推的那次 push 分支是 gh-pages，既不匹配
#     branches 也不匹配 paths，因此不会再触发本工作流。
#     （另外 job 里还有一道 `if` 兜底，见下。）
#   * issue 事件下 github.ref 不可靠（通常是默认分支或 issue 所在仓库的默认 ref），
#     所以 issue / workflow_dispatch 一律显式检出 dev，push 事件才用 github.ref。

name: blog-pipeline

on:
  issues:
    # opened 必须有：用户在新建 issue 时直接勾好 blog 标签提交，只会触发 opened，
    # 不会触发 labeled —— 少了它新文章就不会构建。
    types: [opened, labeled, unlabeled, edited, closed, reopened, deleted]
  push:
    # 只监听 dev：gh-pages 上的机器人提交不会命中这里，天然避免自触发循环。
    branches: [dev]
    paths:
      - 'scripts/**'
      - 'pages/blog/**'
  # 手动重跑（例如首次开启 Pages、或批量补数据）
  workflow_dispatch:

# 默认权限收紧，显式声明的才生效。
permissions:
  contents: write # 需要 push gh-pages
  issues: read # 需要读 issue（REST GET /repos/.../issues）

# 同一时刻只允许一个部署在跑：所有触发源最终都写同一个 gh-pages 分支，
# 用固定组把并发串行化，避免两个部署互相覆盖（后完成的覆盖先完成的）。
# cancel-in-progress 保持 false：部署 push 被中途取消会留下不确定状态，
# 排队执行更安全——每个 run 都会重新拉取最新 issue，所以最后完成的 run 数据一定最新。
concurrency:
  group: blog-gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build issue data and deploy to gh-pages
    runs-on: ubuntu-latest
    # 两道门：
    #   1) 兜底防循环：即使将来 push 触发器被放宽，gh-pages 分支的 push 也直接跳过。
    #   2) 相关性：非 issues 事件一律放行；issues 事件只在「可能与 blog 数据集有关」时放行，
    #      避免"开了个不带 blog 标签的 issue"也白跑一次构建。
    #      放行条件刻意偏保守（unlabeled/deleted 无条件放行），只有能明确判定无关才跳过：
    #        opened  + blog      -> 放行（本次要补的场景）
    #        opened  无 blog     -> 跳过（该 issue 不在 labels=blog 的结果集里）
    #        labeled + blog      -> 放行；labeled 其他标签但 issue 本身是 blog -> 放行
    #        unlabeled / deleted -> 无条件放行（可能是摘掉/删掉了最后一篇）
    #        其他                -> 仅当该 issue 当前带 blog 时放行
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/gh-pages') && (github.event_name != 'issues' || github.event.action == 'unlabeled' || github.event.action == 'deleted' || contains(github.event.issue.labels.*.name, 'blog') || github.event.label.name == 'blog') }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # issue 事件 / 手动触发：github.ref 不可靠，显式检出 dev。
          # push 事件：只可能是 dev（触发器已限定），直接用它触发时的 ref。
          ref: ${{ github.event_name == 'push' && github.ref || 'dev' }}
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build deps (marked)
        # 博客页面的 Markdown 在构建时渲染（利于 SEO、首屏更快）。
        # 依赖声明在仓库根的 package.json 里，用 npm install 安装；
        # marked 缺失会让后面 build-blog 直接失败，因此这里不加 || true 之类的容错。
        run: npm install --no-fund --no-audit

      - name: Build issue data (pages/blog/data/issues.json)
        env:
          # 内置 token，无需自建 secret；配合上面的 issues: read 权限即可读 issue。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 只有「本意就是清空数据集」的入口才允许把非空产物覆盖成空：
          # 摘掉 label / 删除 issue（用户主动下线文章）以及手动 dispatch。
          # 其余入口若 API 返回 0 条而现有数据非空，脚本会拒绝写盘并非零退出（可见失败，而非静默清空）。
          ALLOW_EMPTY: ${{ (github.event_name == 'workflow_dispatch' || github.event.action == 'unlabeled' || github.event.action == 'deleted') && '1' || '0' }}
        run: node scripts/build-issues.mjs

      - name: Build blog pages (list + per-post HTML)
        # 把 issues.json 渲染成 pages/blog/index.html 与 pages/blog/post-{number}.html。
        # 正文 Markdown 在构建时渲染；issue 的 title/tags 等字段一律转义后才进模板。
        run: node scripts/build-blog.mjs

      - name: Stage static site into _site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          # 站点内容 = 首页 + 自定义 404 + 资源 + 页面数据；
          # 仓库元数据（.git/.github/scripts/*.md）不进产物。
          # 404.html 必须一起发布：GitHub Pages 用它替换默认的英文 404，
          # 缺了它，博客文章被下线后留下的旧链接会显示成 GitHub 的默认报错页。
          for item in index.html 404.html assets pages; do
            if [ -e "$item" ]; then
              cp -R "$item" _site/
            fi
          done
          # 关掉 Jekyll，避免下划线开头的文件被吞掉（幂等，重复创建无害）。
          touch _site/.nojekyll
          # 构建产物的健全性检查：缺任一关键产物就失败，不部署半成品。
          test -f _site/pages/blog/data/issues.json
          test -f _site/pages/blog/index.html
          test -f _site/404.html
          echo "--- staged tree ---"
          # 不用 `find | head`：head 提前退出会让 find 收到 SIGPIPE，配合 set -o pipefail
          # 会让本步骤误判失败。限制深度即可，输出量可控。
          find _site -maxdepth 2 -not -path '*/.git/*' | sort

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # 用内置 token，不需要 PAT。
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: blog data @ ${{ github.sha }} (${{ github.event_name }})'
          # 保留 gh-pages 历史（默认 false 即保留；显式写出以免被误改）。
          force_orphan: false
